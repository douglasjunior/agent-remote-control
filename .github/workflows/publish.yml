# Builds the Docker image and publishes it to Docker Hub whenever a GitHub release is published.
#
# The tags come from the release tag (`1.2.3` or `v1.2.3`): `1.2.3`, `1.2`, `1` and `latest`.
# A release marked as "pre-release" is published only with its exact version tag.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   DOCKERHUB_USERNAME: Docker Hub user that owns the image
#   DOCKERHUB_TOKEN:    Docker Hub personal access token with Read & Write permission

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: douglasjunior/agent-remote-control

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }} to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$TAG' is not a semver version (expected e.g. 1.2.3 or v1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
