# coturn for the remote access of Agent Remote Control. The secret, the realm, the public address and the
# bandwidth limits come from the environment through entrypoint.sh.

listening-port=3478

# One relay port per allocation: the range caps the relays open at once, and every port in it must be published.
min-port=49160
max-port=49179

# Credentials of the REST API: the p2p-server hands each session a username "<expiry>:<instance id>" whose password
# is the HMAC-SHA1 of the username under the shared secret, so a credential expires on its own.
use-auth-secret
fingerprint
stale-nonce=600

# Plain TURN over UDP and TCP on 3478; peers are reached over UDP only.
no-tls
no-tcp-relay
no-multicast-peers

# The relay forwards to public addresses only, so nobody uses it to reach the network of the host it runs on. The
# entrypoint also denies TURN_EXTERNAL_IP, the host's own public address, behind which listen services the firewall
# hides from the Internet (Docker Swarm's VXLAN and gossip ports, coturn itself).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::-::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
